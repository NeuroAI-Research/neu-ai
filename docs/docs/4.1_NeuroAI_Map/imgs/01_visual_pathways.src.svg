<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img">
<title>Visual pathways</title>
<style>
text{font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;font-size:1000px}
.lobe{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:5 4}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-coral{fill:#FAECE7;stroke:#993C1D}
</style>
<rect x="0" y="0" width="680" height="620" rx="12" fill="#ffffff"/>
<defs><marker id="m888780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m7F77DD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<txt x="40" y="30" fill="#73726c">$\leftarrow$ Front</txt>
<txt x="340" y="30" size="14" bold="1" fill="#2c2c2a" anchor="middle">Left hemisphere（左半球）, seen from the left</txt>
<txt x="640" y="30" fill="#73726c" anchor="end">Back $\rightarrow$</txt>
<g transform="translate(0,24)">
<rect class="lobe" x="40" y="40" width="200" height="250" rx="12"/><txt x="54" y="64" size="14" bold="1" fill="#2c2c2a">Frontal lobe（额叶）</txt>
<rect class="lobe" x="250" y="40" width="240" height="150" rx="12"/><txt x="264" y="64" size="14" bold="1" fill="#2c2c2a">Parietal lobe（顶叶）</txt>
<rect class="lobe" x="500" y="40" width="140" height="370" rx="12"/><txt x="512" y="64" size="14" bold="1" fill="#2c2c2a">Occipital（枕叶）</txt>
<rect class="lobe" x="150" y="300" width="340" height="110" rx="12"/><txt x="476" y="322" size="14" bold="1" fill="#2c2c2a" anchor="end">Temporal lobe（颞叶）</txt>

<rect class="c-gray" x="50" y="145" width="180" height="66" rx="4" stroke-width="0.5"/>
<txt x="140" y="165" size="14" fill="#444441" anchor="middle">Prefrontal cortex</txt><txt x="140" y="183" fill="#5F5E5A" anchor="middle">前额叶皮层</txt><txt x="140" y="201" fill="#5F5E5A" anchor="middle">Decisions, memory</txt>
<rect class="c-teal" x="270" y="76" width="200" height="66" rx="4" stroke-width="0.5"/>
<txt x="370" y="96" size="14" fill="#085041" anchor="middle">Posterior parietal cortex</txt><txt x="370" y="114" fill="#0F6E56" anchor="middle">后顶叶皮层</txt><txt x="370" y="132" fill="#0F6E56" anchor="middle">Where / how to act</txt>
<rect class="c-teal" x="510" y="72" width="122" height="66" rx="4" stroke-width="0.5"/>
<txt x="571" y="100" size="14" fill="#085041" anchor="middle">V3</txt><txt x="571" y="120" fill="#0F6E56" anchor="middle">Form, depth</txt>
<rect class="c-teal" x="375" y="210" width="110" height="66" rx="4" stroke-width="0.5"/>
<txt x="430" y="238" size="14" fill="#085041" anchor="middle">MT / V5</txt><txt x="430" y="258" fill="#0F6E56" anchor="middle">Motion</txt>
<rect class="c-gray" x="510" y="160" width="55" height="115" rx="4" stroke-width="0.5"/><txt x="537.5" y="216" size="14" fill="#444441" anchor="middle">V2</txt><txt x="537.5" y="234" size="11" fill="#5F5E5A" anchor="middle">Contours</txt>
<rect class="c-gray" x="585" y="160" width="47" height="115" rx="4" stroke-width="0.5"/><txt x="608.5" y="216" size="14" fill="#444441" anchor="middle">V1</txt><txt x="608.5" y="234" size="11" fill="#5F5E5A" anchor="middle">Edges</txt>
<rect class="c-purple" x="510" y="330" width="122" height="66" rx="4" stroke-width="0.5"/>
<txt x="571" y="358" size="14" fill="#3C3489" anchor="middle">V4</txt><txt x="571" y="378" fill="#534AB7" anchor="middle">CNN layer 3</txt>
<rect class="c-purple" x="170" y="330" width="200" height="66" rx="4" stroke-width="0.5"/>
<txt x="270" y="350" size="14" fill="#3C3489" anchor="middle">IT cortex</txt><txt x="270" y="368" fill="#534AB7" anchor="middle">下颞叶皮层</txt><txt x="270" y="386" fill="#534AB7" anchor="middle">Objects, CNN top layer</txt>
<rect class="c-gray" x="40" y="440" width="100" height="66" rx="4" stroke-width="0.5"/>
<txt x="90" y="460" size="14" fill="#444441" anchor="middle">Eye: retina</txt><txt x="90" y="478" fill="#5F5E5A" anchor="middle">视网膜</txt><txt x="90" y="496" fill="#5F5E5A" anchor="middle">Light to spikes</txt>
<rect class="c-gray" x="250" y="440" width="200" height="66" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="350" y="460" size="14" fill="#444441" anchor="middle">LGN（外侧膝状体）</txt><txt x="350" y="478" fill="#5F5E5A" anchor="middle">In the thalamus（丘脑）</txt><txt x="350" y="496" fill="#5F5E5A" anchor="middle">Relays to V1</txt>
