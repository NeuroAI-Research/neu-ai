<path d="M450 473 H656 V217 H634" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<path d="M585 217 H567" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<path d="M537 275 V328" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#m7F77DD)"/>
<path d="M510 363 H372" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#m7F77DD)"/>
<path d="M220 330 V250 H140 V213" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#m7F77DD)"/>
<path d="M537 160 V140" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<path d="M510 243 H487" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<path d="M510 105 H472" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<path d="M430 210 V144" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<path d="M270 109 H140 V143" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<rect x="40" y="526" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/><txt x="60" y="538" fill="#73726c">Shared early stages</txt>
<rect x="330" y="526" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><txt x="350" y="538" fill="#73726c">Ventral “what” stream（腹侧通路）</txt>
<rect x="40" y="552" width="14" height="14" rx="3" class="c-teal" stroke-width="0.5"/><txt x="60" y="564" fill="#73726c">Dorsal “where / how” stream（背侧通路）</txt>
</g>
</svg>
