<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img">
<title>Visual field split · 视野分割</title>
<style>
text{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.t{font-size:14px;fill:#3d3d3a}.ts{font-size:12px;fill:#73726c}.th{font-size:14px;font-weight:500;fill:#2c2c2a}
.lobe{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:5 4}
.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}
.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}
.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}
.c-coral>rect,rect.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}
</style>
<rect x="0" y="0" width="680" height="640" rx="12" fill="#ffffff"/>
<defs><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><line x1="340" y1="40" x2="340" y2="600" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 4"/>
<text class="ts" x="340" y="28" text-anchor="middle">You look here (注视点)</text>
<circle cx="340" cy="65" r="5" fill="#888780"/>
<g class="c-coral"><rect x="100" y="40" width="200" height="50" rx="4" stroke-width="0.5"/><text class="th" x="200" y="61" text-anchor="middle">Left half of scene</text><text class="ts" x="200" y="79" text-anchor="middle">左半视野</text></g>
<g class="c-teal"><rect x="380" y="40" width="200" height="50" rx="4" stroke-width="0.5"/><text class="th" x="480" y="61" text-anchor="middle">Right half of scene</text><text class="ts" x="480" y="79" text-anchor="middle">右半视野</text></g>
<circle cx="240" cy="200" r="40" fill="none" stroke="#73726c" stroke-width="1"/>
<path d="M200 200 A40 40 0 0 0 240 240" fill="none" stroke="#1D9E75" stroke-width="6"/>
<path d="M240 240 A40 40 0 0 0 280 200" fill="none" stroke="#D85A30" stroke-width="6"/>
<circle cx="440" cy="200" r="40" fill="none" stroke="#73726c" stroke-width="1"/>
<path d="M400 200 A40 40 0 0 0 440 240" fill="none" stroke="#1D9E75" stroke-width="6"/>
<path d="M440 240 A40 40 0 0 0 480 200" fill="none" stroke="#D85A30" stroke-width="6"/>
<polyline points="200,90 240,160 268,228" fill="none" stroke="#D85A30" stroke-width="1" opacity="0.7"/>
<polyline points="200,90 440,160 468,228" fill="none" stroke="#D85A30" stroke-width="1" opacity="0.7"/>
<polyline points="480,90 240,160 212,228" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.7"/>
<polyline points="480,90 440,160 412,228" fill="none" stroke="#1D9E75" stroke-width="1" opacity="0.7"/>
<circle cx="240" cy="160" r="4" fill="#73726c"/><circle cx="440" cy="160" r="4" fill="#73726c"/>
<text class="th" x="190" y="196" text-anchor="end">Left eye</text><text class="ts" x="190" y="214" text-anchor="end">左眼</text>
<text class="th" x="490" y="196">Right eye</text><text class="ts" x="490" y="214">右眼</text>
<path d="M212 236 C212 300 200 340 195 398" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<path d="M268 236 Q340 320 450 398" fill="none" stroke="#D85A30" stroke-width="2.5"/>
<path d="M412 236 Q340 320 230 398" fill="none" stroke="#1D9E75" stroke-width="2.5"/>
<path d="M468 236 C468 300 480 340 485 398" fill="none" stroke="#D85A30" stroke-width="2.5"/>
<text class="th" x="378" y="318">Optic chiasm</text><text class="ts" x="378" y="336">视交叉</text>
<rect class="lobe" x="60" y="360" width="270" height="230" rx="12"/><rect class="lobe" x="350" y="360" width="270" height="230" rx="12"/>
<g class="c-teal"><rect x="150" y="400" width="120" height="44" rx="4" stroke-width="0.5"/><text class="th" x="210" y="427" text-anchor="middle">Left LGN</text></g>
<g class="c-coral"><rect x="410" y="400" width="120" height="44" rx="4" stroke-width="0.5"/><text class="th" x="470" y="427" text-anchor="middle">Right LGN</text></g>
<path d="M210 444 V488" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<path d="M470 444 V488" fill="none" stroke="#D85A30" stroke-width="1.5" marker-end="url(#mD85A30)"/>
<g class="c-teal"><rect x="120" y="490" width="180" height="66" rx="4" stroke-width="0.5"/><text class="th" x="210" y="510" text-anchor="middle">Left V1</text><text class="ts" x="210" y="528" text-anchor="middle">Gets right half only</text><text class="ts" x="210" y="546" text-anchor="middle">只接收右半视野</text></g>
<g class="c-coral"><rect x="380" y="490" width="180" height="66" rx="4" stroke-width="0.5"/><text class="th" x="470" y="510" text-anchor="middle">Right V1</text><text class="ts" x="470" y="528" text-anchor="middle">Gets left half only</text><text class="ts" x="470" y="546" text-anchor="middle">只接收左半视野</text></g>
<text class="ts" x="74" y="578">Left hemisphere · 左半球</text><text class="ts" x="364" y="578">Right hemisphere · 右半球</text>
<text class="ts" x="340" y="620" text-anchor="middle">Seen from above (从头顶俯视), eyes facing the scene</text>
</svg>
