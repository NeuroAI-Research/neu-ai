<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1592" viewBox="0 0 680 1592" role="img">
<title>Standard dopamine RL model</title>
<style>
text{font-family:"Songti SC","STSong","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;font-size:1000px}
.panel{fill:#FAFAF8;stroke:#D3D1C7;stroke-width:0.5}
.lobe{fill:none;stroke:#B4B2A9;stroke-width:1;stroke-dasharray:5 4}
.deep{fill:none;stroke:#888780;stroke-width:0.5;stroke-dasharray:4 3}
.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-purple{fill:#EEEDFE;stroke:#534AB7}
.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-coral{fill:#FAECE7;stroke:#993C1D}
</style>
<rect x="0" y="0" width="680" height="1592" rx="12" fill="#ffffff"/>
<defs><marker id="m888780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m7F77DD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- ============ Title ============ -->
<txt x="40" y="38" size="22" bold="1" fill="#2c2c2a">Standard dopamine RL model: TD actor-critic</txt>
<txt x="40" y="62" fill="#73726c">Schultz, Dayan &amp; Montague 1997; Barto 1995</txt>

<!-- ============ A. Algorithm ============ -->
<rect class="panel" x="20" y="80" width="640" height="476" rx="8"/>
<txt x="40" y="108" size="15" bold="1" fill="#2c2c2a">Algorithm</txt>

<txt x="40" y="136" bold="1">Two learned functions</txt>
<tex x="56" y="168" size="16" anchor="start">V(s)</tex>
<txt x="150" y="158" fill="#0F6E56">State value: expected future reward from state $s$</txt>
<txt x="150" y="176" fill="#0F6E56">Critic, stored in ventral striatum（腹侧纹状体）</txt>
<tex x="56" y="212" size="16" anchor="start">H(s,a)</tex>
<txt x="150" y="202" fill="#534AB7">Action preference: how much the agent likes $a$ in $s$</txt>
<txt x="150" y="220" fill="#534AB7">Actor, stored in dorsal striatum（背侧纹状体）</txt>
<tex x="150" y="262" size="16" anchor="start">\pi(a \mid s) = \dfrac{\exp H(s,a)}{\sum_b \exp H(s,b)}</tex>
<txt x="420" y="266" fill="#534AB7">softmax: preference $\to$ policy</txt>

<txt x="40" y="300" bold="1">Repeat every time step $t$:</txt>

<circle cx="48" cy="325" r="9" fill="#5F5E5A"/><txt x="48" y="329" size="12" bold="1" fill="#ffffff" anchor="middle">1</txt>
<tex x="66" y="330" size="16" anchor="start">\text{observe } s_t</tex>
<txt x="350" y="324" fill="#5F5E5A">Cortex encodes the current state</txt>
<txt x="350" y="342" fill="#5F5E5A">(visual cortex is one example input)</txt>

<circle cx="48" cy="365" r="9" fill="#534AB7"/><txt x="48" y="369" size="12" bold="1" fill="#ffffff" anchor="middle">2</txt>
<tex x="66" y="370" size="16" anchor="start">a_t \sim \pi(\cdot \mid s_t)</tex>
<txt x="350" y="364" fill="#534AB7">Actor picks: dorsal striatum $\to$</txt>
<txt x="350" y="382" fill="#534AB7">thalamus（丘脑）$\to$ motor cortex</txt>

<circle cx="48" cy="405" r="9" fill="#5F5E5A"/><txt x="48" y="409" size="12" bold="1" fill="#ffffff" anchor="middle">3</txt>
<tex x="66" y="410" size="16" anchor="start">r_t,\ s_{t+1} = \mathrm{env}(s_t, a_t)</tex>
<txt x="350" y="413" fill="#5F5E5A">Environment returns reward and next state</txt>

<circle cx="48" cy="445" r="9" fill="#993C1D"/><txt x="48" y="449" size="12" bold="1" fill="#ffffff" anchor="middle">4</txt>
<tex x="66" y="450" size="16" anchor="start">\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)</tex>
<txt x="350" y="444" fill="#993C1D">Reward prediction error, sent as phasic dopamine</txt>
<txt x="350" y="462" fill="#993C1D">burst if better than expected, dip if worse</txt>

<circle cx="48" cy="485" r="9" fill="#0F6E56"/><txt x="48" y="489" size="12" bold="1" fill="#ffffff" anchor="middle">5</txt>
<tex x="66" y="490" size="16" anchor="start">V(s_t) \leftarrow V(s_t) + \alpha_V\, \delta_t</tex>
<txt x="350" y="484" fill="#0F6E56">Critic: move $V(s_t)$ toward the target $r_t + \gamma V(s_{t+1})$</txt>
<txt x="350" y="502" fill="#0F6E56">(dopamine adjusts ventral striatum synapses)</txt>

<circle cx="48" cy="525" r="9" fill="#534AB7"/><txt x="48" y="529" size="12" bold="1" fill="#ffffff" anchor="middle">6</txt>
<tex x="66" y="530" size="16" anchor="start">H(s_t,a_t) \leftarrow H(s_t,a_t) + \alpha_\pi\, \delta_t</tex>
<txt x="350" y="524" fill="#534AB7">Actor: if $\delta_t&gt;0$, choose $a_t$ more often in $s_t$</txt>
<txt x="350" y="542" fill="#534AB7">(dopamine adjusts dorsal striatum synapses)</txt>

<!-- ============ B. Brain map ============ -->
<g transform="translate(0,574)">
<txt x="40" y="30" fill="#73726c">$\leftarrow$ Front</txt>
<txt x="340" y="30" size="14" bold="1" fill="#2c2c2a" anchor="middle">Left hemisphere（左半球）, seen from the left</txt>
<txt x="640" y="30" fill="#73726c" anchor="end">Back $\rightarrow$</txt>
<g transform="translate(0,24)">
<rect class="lobe" x="40" y="40" width="260" height="106" rx="12"/><txt x="54" y="64" size="14" bold="1" fill="#2c2c2a">Frontal lobe（额叶）</txt>
<rect class="lobe" x="310" y="40" width="120" height="150" rx="12"/><txt x="322" y="64" size="14" bold="1" fill="#2c2c2a">Parietal（顶叶）</txt>
<rect class="lobe" x="440" y="40" width="200" height="106" rx="12"/><txt x="452" y="64" size="14" bold="1" fill="#2c2c2a">Occipital（枕叶）</txt>

<rect class="c-gray" x="48" y="76" width="244" height="56" rx="4" stroke-width="0.5"/>
<txt x="58" y="96" size="14" fill="#444441">Motor cortex（运动皮层）</txt>
<txt x="58" y="120" size="12" fill="#5F5E5A">Executes the chosen action $a_t$</txt>
<circle cx="48" cy="76" r="9" fill="#534AB7"/><txt x="48" y="80" size="12" bold="1" fill="#ffffff" anchor="middle">2</txt>
<rect class="c-gray" x="450" y="76" width="182" height="56" rx="4" stroke-width="0.5"/>
<txt x="460" y="96" size="14" fill="#444441">Visual cortex</txt>
<tex x="460" y="120" size="14" fill="#5F5E5A" anchor="start">s_t = \mathrm{enc}(\text{scene})</tex>
<circle cx="450" cy="76" r="9" fill="#5F5E5A"/><txt x="450" y="80" size="12" bold="1" fill="#ffffff" anchor="middle">1</txt>
<rect class="c-purple" x="320" y="200" width="290" height="78" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="330" y="220" size="14" fill="#3C3489">Dorsal striatum（背侧纹状体）: actor</txt>
<tex x="330" y="244" size="14" fill="#534AB7" anchor="start">a_t \sim \pi(\cdot \mid s_t) = \mathrm{softmax}\, H(s_t, \cdot)</tex>
<tex x="330" y="266" size="14" fill="#534AB7" anchor="start">H(s_t,a_t) \leftarrow H(s_t,a_t) + \alpha_\pi\, \delta_t</tex>
<circle cx="610" cy="200" r="9" fill="#534AB7"/><txt x="610" y="204" size="12" bold="1" fill="#ffffff" anchor="middle">6</txt>
<rect class="c-teal" x="320" y="298" width="290" height="78" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="330" y="318" size="14" fill="#085041">Ventral striatum（腹侧纹状体）: critic</txt>
<tex x="330" y="342" size="14" fill="#0F6E56" anchor="start">V(s_t),\ V(s_{t+1})</tex>
<tex x="330" y="364" size="14" fill="#0F6E56" anchor="start">V(s_t) \leftarrow V(s_t) + \alpha_V\, \delta_t</tex>
<circle cx="610" cy="298" r="9" fill="#0F6E56"/><txt x="610" y="302" size="12" bold="1" fill="#ffffff" anchor="middle">5</txt>
<rect class="c-gray" x="40" y="426" width="252" height="56" rx="4" stroke-width="0.5"/>
<txt x="50" y="446" size="14" fill="#444441">Environment</txt>
<tex x="50" y="470" size="14" fill="#5F5E5A" anchor="start">r_t,\ s_{t+1} = \mathrm{env}(s_t, a_t)</tex>
<circle cx="40" cy="426" r="9" fill="#5F5E5A"/><txt x="40" y="430" size="12" bold="1" fill="#ffffff" anchor="middle">3</txt>
<rect class="c-coral" x="320" y="426" width="290" height="56" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="330" y="446" size="14" fill="#712B13">VTA / SNc（中脑多巴胺神经元）</txt>
<tex x="330" y="470" size="14" fill="#993C1D" anchor="start">\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)</tex>
<circle cx="320" cy="426" r="9" fill="#993C1D"/><txt x="320" y="430" size="12" bold="1" fill="#ffffff" anchor="middle">4</txt>

<!-- state: world -> visual cortex -> striatum -->
<path d="M166 482 V496 H656 V104 H634" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<tex x="650" y="406" size="14" fill="#5F5E5A" anchor="end">s_{t+1}</tex>
<path d="M541 132 V198" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<tex x="549" y="171" size="14" fill="#5F5E5A" anchor="start">s_t</tex>
<path d="M624 132 V338 H612" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<tex x="630" y="249" size="14" fill="#5F5E5A" anchor="start">s_t</tex>
<!-- action: dorsal striatum -> thalamus -> motor cortex -> world -->
<path d="M340 200 V110 H294" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#m7F77DD)"/>
<tex x="348" y="186" size="14" fill="#534AB7" anchor="start">a_t</tex>
<path d="M100 132 V424" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<tex x="108" y="279" size="14" fill="#5F5E5A" anchor="start">a_t</tex>
<!-- reward and value to VTA, dopamine back to both -->
<path d="M292 468 H318" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<tex x="305" y="488" size="14" fill="#5F5E5A" anchor="middle">r_t</tex>
<path d="M420 376 V424" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<tex x="412" y="406" size="14" fill="#0F6E56" anchor="end">V(s_t),\ V(s_{t+1})</tex>
<path d="M560 426 V378" fill="none" stroke="#D85A30" stroke-width="2" marker-end="url(#mD85A30)"/>
<tex x="568" y="406" size="14" fill="#993C1D" anchor="start">\delta_t</tex>
<path d="M320 438 H306 V240 H318" fill="none" stroke="#D85A30" stroke-width="2" marker-end="url(#mD85A30)"/>
<tex x="300" y="333" size="14" fill="#993C1D" anchor="end">\delta_t</tex>
<rect x="40" y="516" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/>
<txt x="60" y="528" fill="#73726c">Cortex / environment</txt>
<rect x="330" y="516" width="14" height="14" rx="3" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 2"/>
<txt x="350" y="528" fill="#73726c">Dashed = deep structure</txt>
<rect x="40" y="542" width="14" height="14" rx="3" class="c-teal" stroke-width="0.5"/>
<txt x="60" y="554" fill="#73726c">Critic: learns $V$</txt>
<rect x="330" y="542" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/>
<txt x="350" y="554" fill="#73726c">Actor: learns $H$, i.e. $\pi$</txt>
<rect x="40" y="568" width="14" height="14" rx="3" class="c-coral" stroke-width="0.5"/>
<txt x="60" y="580" fill="#73726c">Dopamine carries $\delta_t$ to both critic and actor</txt>
<txt x="40" y="606" fill="#73726c">$a_t$ goes from dorsal striatum to motor cortex via the thalamus（丘脑）</txt>
</g>
</g>

<!-- ============ C. From tables to synapses ============ -->
<rect class="panel" x="20" y="1232" width="640" height="340" rx="8"/>
<txt x="40" y="1260" size="15" bold="1" fill="#2c2c2a">Why “dopamine-gated corticostriatal plasticity”?</txt>
<txt x="40" y="1280" fill="#73726c">corticostriatal（皮层-纹状体）: synapses from cortex onto striatum</txt>
<txt x="40" y="1298" fill="#73726c">plasticity（可塑性）: synapses changing their strength</txt>
<txt x="40" y="1324">The brain has no table for $V(s)$. A striatal neuron computes it from its cortical inputs:</txt>
<tex x="340" y="1362" size="17">V(s) = \sum_i w_i\, x_i(s)</tex>
<tex x="40" y="1396" size="15" anchor="start">x_i(s)</tex>
<txt x="96" y="1396">firing of cortical neuron $i$ in state $s$, i.e. the presynaptic（突触前）input</txt>
<tex x="40" y="1420" size="15" anchor="start">w_i</tex>
<txt x="96" y="1420">strength of synapse $i$: this is what is learned</txt>
<txt x="40" y="1450">Step 5 then becomes a local rule that each synapse can apply by itself:</txt>
<tex x="340" y="1486" size="17">\Delta w_i = \alpha_V\, \delta_t\, x_i(s_t)</tex>
<txt x="40" y="1518">A synapse changes only if its input was active ($x_i&gt;0$) AND dopamine reports a surprise ($\delta_t \neq 0$).</txt>
<txt x="40" y="1536">Two factors: presynaptic activity $\times$ dopamine. The actor's rule adds a third, postsynaptic factor:</txt>
<txt x="40" y="1554">only synapses onto the striatal neurons of the chosen action $a_t$ change (pre $\times$ post $\times$ dopamine).</txt>
</svg>
