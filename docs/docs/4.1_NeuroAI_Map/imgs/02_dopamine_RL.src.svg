<defs><marker id="m888780" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m7F77DD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="m1D9E75" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="mD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<!-- ============ Title ============ -->
<txt x="40" y="38" size="22" bold="1" fill="#2c2c2a">Standard dopamine RL model: TD actor-critic</txt>
<txt x="40" y="62" fill="#73726c">Schultz, Dayan &amp; Montague 1997; Barto 1995</txt>

<!-- ============ A. Algorithm ============ -->
<rect class="panel" x="20" y="80" width="640" height="476" rx="8"/>
<txt x="40" y="108" size="15" bold="1" fill="#2c2c2a">Algorithm</txt>

<txt x="40" y="136" bold="1">Two learned functions</txt>
<tex x="56" y="168" size="16" anchor="start">V(s)</tex>
<txt x="150" y="158" fill="#0F6E56">State value: expected future reward from state $s$</txt>
<txt x="150" y="176" fill="#0F6E56">Critic, stored in ventral striatum（腹侧纹状体）</txt>
<tex x="56" y="212" size="16" anchor="start">H(s,a)</tex>
<txt x="150" y="202" fill="#534AB7">Action preference: how much the agent likes $a$ in $s$</txt>
<txt x="150" y="220" fill="#534AB7">Actor, stored in dorsal striatum（背侧纹状体）</txt>
<tex x="150" y="262" size="16" anchor="start">\pi(a \mid s) = \dfrac{\exp H(s,a)}{\sum_b \exp H(s,b)}</tex>
<txt x="420" y="266" fill="#534AB7">softmax: preference $\to$ policy</txt>

<txt x="40" y="300" bold="1">Repeat every time step $t$:</txt>

<circle cx="48" cy="325" r="9" fill="#5F5E5A"/><txt x="48" y="329" size="12" bold="1" fill="#ffffff" anchor="middle">1</txt>
<tex x="66" y="330" size="16" anchor="start">\text{observe } s_t</tex>
<txt x="350" y="324" fill="#5F5E5A">Cortex encodes the current state</txt>
<txt x="350" y="342" fill="#5F5E5A">(visual cortex is one example input)</txt>

<circle cx="48" cy="365" r="9" fill="#534AB7"/><txt x="48" y="369" size="12" bold="1" fill="#ffffff" anchor="middle">2</txt>
<tex x="66" y="370" size="16" anchor="start">a_t \sim \pi(\cdot \mid s_t)</tex>
<txt x="350" y="364" fill="#534AB7">Actor picks: dorsal striatum $\to$</txt>
<txt x="350" y="382" fill="#534AB7">thalamus（丘脑）$\to$ motor cortex</txt>

<circle cx="48" cy="405" r="9" fill="#5F5E5A"/><txt x="48" y="409" size="12" bold="1" fill="#ffffff" anchor="middle">3</txt>
<tex x="66" y="410" size="16" anchor="start">r_t,\ s_{t+1} = \mathrm{env}(s_t, a_t)</tex>
<txt x="350" y="413" fill="#5F5E5A">Environment returns reward and next state</txt>

<circle cx="48" cy="445" r="9" fill="#993C1D"/><txt x="48" y="449" size="12" bold="1" fill="#ffffff" anchor="middle">4</txt>
<tex x="66" y="450" size="16" anchor="start">\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)</tex>
<txt x="350" y="444" fill="#993C1D">Reward prediction error, sent as phasic dopamine</txt>
<txt x="350" y="462" fill="#993C1D">burst if better than expected, dip if worse</txt>

<circle cx="48" cy="485" r="9" fill="#0F6E56"/><txt x="48" y="489" size="12" bold="1" fill="#ffffff" anchor="middle">5</txt>
<tex x="66" y="490" size="16" anchor="start">V(s_t) \leftarrow V(s_t) + \alpha_V\, \delta_t</tex>
<txt x="350" y="484" fill="#0F6E56">Critic: move $V(s_t)$ toward the target $r_t + \gamma V(s_{t+1})$</txt>
<txt x="350" y="502" fill="#0F6E56">(dopamine adjusts ventral striatum synapses)</txt>

<circle cx="48" cy="525" r="9" fill="#534AB7"/><txt x="48" y="529" size="12" bold="1" fill="#ffffff" anchor="middle">6</txt>
<tex x="66" y="530" size="16" anchor="start">H(s_t,a_t) \leftarrow H(s_t,a_t) + \alpha_\pi\, \delta_t</tex>
<txt x="350" y="524" fill="#534AB7">Actor: if $\delta_t&gt;0$, choose $a_t$ more often in $s_t$</txt>
<txt x="350" y="542" fill="#534AB7">(dopamine adjusts dorsal striatum synapses)</txt>

<!-- ============ B. Brain map ============ -->
<g transform="translate(0,574)">
<txt x="40" y="30" fill="#73726c">$\leftarrow$ Front</txt>
<txt x="340" y="30" size="14" bold="1" fill="#2c2c2a" anchor="middle">Left hemisphere（左半球）, seen from the left</txt>
<txt x="640" y="30" fill="#73726c" anchor="end">Back $\rightarrow$</txt>
<g transform="translate(0,24)">
<rect class="lobe" x="40" y="40" width="200" height="260" rx="12"/><txt x="54" y="64" size="14" bold="1" fill="#2c2c2a">Frontal lobe（额叶）</txt>
<rect class="lobe" x="250" y="40" width="240" height="146" rx="12"/><txt x="264" y="64" size="14" bold="1" fill="#2c2c2a">Parietal lobe（顶叶）</txt>
<rect class="lobe" x="500" y="40" width="140" height="380" rx="12"/><txt x="512" y="64" size="14" bold="1" fill="#2c2c2a">Occipital（枕叶）</txt>
<rect class="lobe" x="150" y="342" width="340" height="78" rx="12"/><txt x="164" y="364" size="14" bold="1" fill="#2c2c2a">Temporal lobe（颞叶）</txt>

<rect class="c-gray" x="60" y="76" width="170" height="66" rx="4" stroke-width="0.5"/>
<txt x="145" y="96" size="14" fill="#444441" anchor="middle">Motor cortex</txt><txt x="145" y="114" fill="#5F5E5A" anchor="middle">Executes the action</txt>
<tex x="145" y="135" size="15" fill="#5F5E5A">a_t</tex>
<circle cx="60" cy="76" r="9" fill="#534AB7"/><txt x="60" y="80" size="12" bold="1" fill="#ffffff" anchor="middle">2</txt>

<rect class="c-gray" x="506" y="76" width="130" height="66" rx="4" stroke-width="0.5"/>
<txt x="571" y="96" size="14" fill="#444441" anchor="middle">Visual cortex</txt><txt x="571" y="114" fill="#5F5E5A" anchor="middle">e.g. what you see</txt>
<tex x="571" y="135" size="15" fill="#5F5E5A">s_t</tex>
<circle cx="506" cy="76" r="9" fill="#5F5E5A"/><txt x="506" y="80" size="12" bold="1" fill="#ffffff" anchor="middle">1</txt>

<rect class="deep" x="250" y="194" width="244" height="140" rx="8"/>
<txt x="258" y="214" size="14" bold="1" fill="#2c2c2a">Striatum</txt><txt x="258" y="232" fill="#73726c">纹状体</txt>
<rect class="c-purple" x="328" y="202" width="158" height="60" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="407" y="220" size="14" fill="#3C3489" anchor="middle">Dorsal striatum</txt><txt x="407" y="237" fill="#534AB7" anchor="middle">Actor（背侧纹状体）</txt>
<tex x="407" y="256" size="15" fill="#534AB7">H(s,a)</tex>
<circle cx="486" cy="202" r="9" fill="#534AB7"/><txt x="486" y="206" size="12" bold="1" fill="#ffffff" anchor="middle">6</txt>
<rect class="c-teal" x="258" y="268" width="158" height="60" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="337" y="286" size="14" fill="#085041" anchor="middle">Ventral striatum</txt><txt x="337" y="303" fill="#0F6E56" anchor="middle">Critic（腹侧纹状体）</txt>
<tex x="337" y="322" size="15" fill="#0F6E56">V(s)</tex>
<circle cx="258" cy="268" r="9" fill="#0F6E56"/><txt x="258" y="272" size="12" bold="1" fill="#ffffff" anchor="middle">5</txt>

<rect class="c-coral" x="320" y="458" width="190" height="66" rx="4" stroke-width="0.5" stroke-dasharray="4 3"/>
<txt x="415" y="478" size="14" fill="#712B13" anchor="middle">VTA / SNc</txt><txt x="415" y="496" fill="#993C1D" anchor="middle">中脑多巴胺神经元</txt>
<tex x="415" y="516" size="15" fill="#993C1D">\delta_t = r_t + \gamma V(s_{t+1}) - V(s_t)</tex>
<circle cx="320" cy="458" r="9" fill="#993C1D"/><txt x="320" y="462" size="12" bold="1" fill="#ffffff" anchor="middle">4</txt>
<rect class="c-gray" x="40" y="458" width="160" height="66" rx="4" stroke-width="0.5"/>
<txt x="120" y="478" size="14" fill="#444441" anchor="middle">Environment</txt><txt x="120" y="496" fill="#5F5E5A" anchor="middle">Reward and next state</txt>
<tex x="120" y="516" size="15" fill="#5F5E5A">r_t,\ s_{t+1}</tex>
<circle cx="40" cy="458" r="9" fill="#5F5E5A"/><txt x="40" y="462" size="12" bold="1" fill="#ffffff" anchor="middle">3</txt>

<path d="M571 142 V228 H496" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<path d="M360 202 V109 H232" fill="none" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#m7F77DD)"/>
<txt x="366" y="160" size="12" fill="#534AB7">via thalamus（丘脑）</txt>
<path d="M110 142 V456" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<path d="M120 524 V546 H656 V109 H638" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<path d="M200 491 H318" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#m888780)"/>
<path d="M340 328 V456" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#m1D9E75)"/>
<path d="M400 456 V330" fill="none" stroke="#D85A30" stroke-width="2" marker-end="url(#mD85A30)"/>
<path d="M470 456 V264" fill="none" stroke="#D85A30" stroke-width="2" marker-end="url(#mD85A30)"/>

<rect x="40" y="566" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/><txt x="60" y="578" fill="#73726c">Cortex / environment</txt>
<rect x="330" y="566" width="14" height="14" rx="3" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 2"/><txt x="350" y="578" fill="#73726c">Dashed = deep structure</txt>
<rect x="40" y="592" width="14" height="14" rx="3" class="c-teal" stroke-width="0.5"/><txt x="60" y="604" fill="#73726c">Critic: learns $V$</txt>
<rect x="330" y="592" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><txt x="350" y="604" fill="#73726c">Actor: learns $H$, i.e. $\pi$</txt>
<rect x="40" y="618" width="14" height="14" rx="3" class="c-coral" stroke-width="0.5"/><txt x="60" y="630" fill="#73726c">Dopamine carries $\delta_t$ to both critic and actor</txt>
</g>
</g>

<!-- ============ C. From tables to synapses ============ -->
<rect class="panel" x="20" y="1256" width="640" height="340" rx="8"/>
<txt x="40" y="1284" size="15" bold="1" fill="#2c2c2a">Why “dopamine-gated corticostriatal plasticity”?</txt>
<txt x="40" y="1304" fill="#73726c">corticostriatal（皮层-纹状体）: synapses from cortex onto striatum</txt>
<txt x="40" y="1322" fill="#73726c">plasticity（可塑性）: synapses changing their strength</txt>
<txt x="40" y="1348">The brain has no table for $V(s)$. A striatal neuron computes it from its cortical inputs:</txt>
<tex x="340" y="1386" size="17">V(s) = \sum_i w_i\, x_i(s)</tex>
<tex x="40" y="1420" size="15" anchor="start">x_i(s)</tex>
<txt x="96" y="1420">firing of cortical neuron $i$ in state $s$, i.e. the presynaptic（突触前）input</txt>
<tex x="40" y="1444" size="15" anchor="start">w_i</tex>
<txt x="96" y="1444">strength of synapse $i$: this is what is learned</txt>
<txt x="40" y="1474">Step 5 then becomes a local rule that each synapse can apply by itself:</txt>
<tex x="340" y="1510" size="17">\Delta w_i = \alpha_V\, \delta_t\, x_i(s_t)</tex>
<txt x="40" y="1542">A synapse changes only if its input was active ($x_i&gt;0$) AND dopamine reports a surprise ($\delta_t \neq 0$).</txt>
<txt x="40" y="1560">Two factors: presynaptic activity $\times$ dopamine. The actor's rule adds a third, postsynaptic factor:</txt>
<txt x="40" y="1578">only synapses onto the striatal neurons of the chosen action $a_t$ change (pre $\times$ post $\times$ dopamine).</txt>
</svg>
